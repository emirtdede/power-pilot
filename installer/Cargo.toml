[package]
name = "powerpilot-setup"
version = "1.0.0"
edition = "2021"
description = "Power Pilot modern frameless monochrome single-file Setup and Uninstaller"

[lib]
name = "powerpilot_setup_lib"
path = "src/lib.rs"

[[bin]]
name = "powerpilot-setup"
path = "src/main.rs"

[[bin]]
name = "pp-pack"
path = "src/bin/pp_pack.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tao = "0.34"
wry = { version = "0.53", default-features = false, features = ["os-webview", "protocol", "transparent"] }
zip = { version = "2.6", default-features = false, features = ["deflate", "zstd"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Dwm",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
